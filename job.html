<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lambadina — Opportunity</title>
<style>
:root{--bg:#030a13;--panel:#081b2c;--panel2:#0b2237;--line:#183b53;--text:#f4f8fc;--muted:#8fa7bb;--orange:#ff9e2c;--blue:#22a8ff;--green:#43d49a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(24,113,181,.22),transparent 30%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Arial}.top{height:3px;background:linear-gradient(90deg,var(--orange),var(--blue),var(--orange))}.wrap{width:min(1120px,calc(100% - 30px));margin:auto}header{height:76px;border-bottom:1px solid #123048;background:rgba(3,10,19,.82);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between}header img{width:150px}.nav{display:flex;gap:10px}.btn{display:inline-block;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#071724;color:#fff;text-decoration:none;font-weight:750}.primary{background:linear-gradient(135deg,var(--orange),#ff7919);color:#07111b;border:0}.hero{padding:70px 0 42px;border-bottom:1px solid #123048}.crumb{color:#7390a5;font-size:13px;margin-bottom:20px}.hero-grid{display:grid;grid-template-columns:1fr 310px;gap:25px}.badge{display:inline-block;color:#ffc26d;background:#281c0e;border:1px solid #754a1c;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(38px,6vw,65px);line-height:1.02;letter-spacing:-.05em;margin:18px 0 10px;text-transform:capitalize}.company{font-size:18px;color:#9db3c3}.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chip{padding:8px 11px;border:1px solid #20445d;border-radius:9px;background:#071827;color:#a5bacb}.applybox{background:linear-gradient(145deg,#0b2438,#061421);border:1px solid #20445d;border-radius:20px;padding:24px;align-self:start;box-shadow:0 25px 60px #0005}.applybox h3{margin-top:0}.applybox .big{display:block;width:100%;text-align:center;margin:14px 0}.content{display:grid;grid-template-columns:1.4fr .7fr;gap:24px;padding:45px 0}.card{background:#071a2a;border:1px solid #173a51;border-radius:18px;padding:27px}.card h2{margin-top:0}.text{white-space:pre-wrap;color:#a9bdcc}.side h3{margin-top:0}.row{padding:13px 0;border-bottom:1px solid #173449}.row:last-child{border:0}.row small{display:block;color:#6f8ba0}.row b{display:block}.notice{padding:16px;border:1px solid #25475e;background:#0a1e30;border-radius:12px;color:#a8bdcd;margin-top:20px}.back{display:inline-block;color:#8bcfff;margin-bottom:18px}footer{border-top:1px solid #123048;padding:30px 0;color:#637f92;margin-top:20px}@media(max-width:800px){.hero-grid,.content{grid-template-columns:1fr}.applybox{order:-1}.nav .btn:not(.primary){display:none}}
</style></head><body><div class="top"></div><header><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:min(1120px,calc(100% - 30px))"><a href="index.html"><img src="logo.png" alt="Lambadina"></a><div class="nav"><a class="btn" href="index.html#jobs">← All Jobs</a><a class="btn primary" href="https://t.me/lambadina_jobs">Telegram</a></div></div></header>
<main class="wrap" id="app"><div style="padding:70px 0;text-align:center">Loading opportunity…</div></main>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function title(j){return j.positions?.[0]||"Opportunity"}
function getId(){return new URLSearchParams(location.search).get("id")}
async function init(){const d=await (await fetch("jobs.json")).json();const j=(d.jobs||[]).find(x=>x.id===getId());if(!j){document.getElementById("app").innerHTML='<div style="padding:100px 0;text-align:center"><h1>Opportunity not found</h1><a class="btn primary" href="index.html">Return to jobs</a></div>';return}
const t=title(j), cat=(j.category||["General"]).join(" • ");document.title=`${t} — Lambadina`;
const location=(j.text||"").match(/(?:📍 Location:|📍)\s*([^\n]+)/i)?.[1]||"Ethiopia";
let source=j.link?`<a class="btn primary big" target="_blank" rel="noopener" href="${esc(j.link)}">Open Application Source →</a>`:(j.contact?`<a class="btn primary big" href="mailto:${esc(j.contact)}">Apply / Contact →</a>`:`<a class="btn primary big" href="https://t.me/lambadina_jobs">Ask via Telegram →</a>`);
document.getElementById("app").innerHTML=`<section class="hero"><a class="back" href="index.html#jobs">← Back to opportunities</a><div class="hero-grid"><div><span class="badge">${esc(cat)}</span><h1>${esc(t)}</h1><div class="company">${esc(j.company||"Organization")}</div><div class="quick"><span class="chip">⌖ ${esc(location)}</span><span class="chip">◷ Deadline: ${esc(j.deadline||"Not specified")}</span><span class="chip">↗ Posted: ${esc((j.posted||"").slice(0,10)||"Recent")}</span></div></div><aside class="applybox"><h3>Ready for the next step?</h3><p style="color:#8da5b7">Review the opportunity details, then continue through the available application route.</p>${source}</aside></div></section><section class="content"><article class="card"><h2>Opportunity details</h2><div class="text">${esc(j.text||j.about||"No additional description available.")}</div></article><aside class="card side"><h3>At a glance</h3><div class="row"><small>Organization</small><b>${esc(j.company||"Not specified")}</b></div><div class="row"><small>Category</small><b>${esc(cat)}</b></div><div class="row"><small>Location</small><b>${esc(location)}</b></div><div class="row"><small>Deadline</small><b>${esc(j.deadline||"Not specified")}</b></div><div class="row"><small>Application method</small><b>${esc(j.application_method||"See source details")}</b></div>${j.contact?`<div class="row"><small>Contact</small><b>${esc(j.contact)}</b></div>`:""}<div class="notice">Always review the original vacancy information and application instructions before sending personal documents.</div></aside></section>`}
init();
</script><footer><div class="wrap">© 2026 Lambadina — Light Your Next Path.</div></footer></body></html>
